# Kesariya / Aaradhana — Contabo nginx site
# Install:
#   sudo cp deploy/nginx/aaradhana.khodi.in.conf /etc/nginx/sites-available/aaradhana.khodi.in
#   sudo ln -sf /etc/nginx/sites-available/aaradhana.khodi.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL (after DNS points here):
#   sudo certbot --nginx -d aaradhana.khodi.in

server {
    listen 80;
    listen [::]:80;
    server_name aaradhana.khodi.in;

    client_max_body_size 12M;

    root /var/www/aaradhana/frontend/dist;
    index index.html;

    # Frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → Node (PM2)
    location /api/ {
        proxy_pass http://127.0.0.1:4010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploads (payment proofs, QR)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4010/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Never cache SPA shell
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/aaradhana.access.log;
    error_log  /var/log/nginx/aaradhana.error.log;
}
