services:
  postgres:
    image: postgres:16-alpine
    container_name: kesariya-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: kesariya
      POSTGRES_PASSWORD: kesariya_dev
      POSTGRES_DB: kesariya
    volumes:
      - kesariya_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kesariya -d kesariya"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kesariya_pg_data:
